<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B25D" />
      <stop offset="50%" stop-color="#C98A3C" />
      <stop offset="100%" stop-color="#965B1A" />
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222632" />
      <stop offset="100%" stop-color="#12141A" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C98A3C" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Icon container -->
  <rect width="46" height="46" x="7" y="7" rx="12" fill="url(#charcoalGrad)" stroke="#C98A3C" stroke-width="1.2" stroke-opacity="0.5" />
  
  <!-- Bronze Brand Emblem -->
  <path d="M22 36L30 18L38 36" stroke="url(#bronzeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 31H35" stroke="url(#bronzeGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="30" cy="18" r="2" fill="#E5B25D" filter="url(#subtleGlow)"/>

  <!-- Brand Typography -->
  <text x="64" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8F6F2" letter-spacing="1.2">APPLEN</text>
  <text x="138" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="400" fill="#C98A3C" letter-spacing="1.2">SOLUTIONS</text>
  <text x="65" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#8F857B" letter-spacing="2.2">ENTERPRISE SUPPORT DESK</text>
</svg>
